; Portable AQI Recorder V3 — firmware for the main board Rev B (hardware/rev-b/main).
; Build: pio run          Flash over J1 (USB-C): pio run -t upload          Logs: pio device monitor

[env:aqi-main-revb]
platform = espressif32@6.5.0
; The board carries an ESP32-C3-MINI-1-H4X (4 MB flash), the same module as this devkit.
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+

; The battery-% PWM receiver is shared with the battery board docs in hardware/rev-b/firmware/telemetry.
build_src_filter = +<*> +<../../hardware/rev-b/firmware/telemetry/BatteryPwmReader.cpp>

build_flags =
    -I ../hardware/rev-b/firmware/telemetry
    ; Serial is the native USB CDC on J1 (GPIO18/19). GPIO21 is the battery-PWM input,
    ; so UART0 TX must stay unused.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI: ST7789 240x320 on J5 (main board Rev B pin map)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=0
    -D TFT_INVERSION_OFF=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=-1
    -D TFT_MOSI=6
    -D TFT_SCLK=5
    -D TFT_CS=4
    -D TFT_DC=10
    -D TFT_RST=7
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_GFXFF=1
    -D SPI_FREQUENCY=40000000
    ; 2 = image turned 180 deg (flex exits at the top of the board). Change if the image is upside down.
    -D DISPLAY_ROTATION=2

lib_deps =
    sensirion/Sensirion I2C SEN5X @ ^0.3.0
    sensirion/Sensirion I2C SEN63C @ ^1.1.0
    sensirion/Sensirion I2C SEN65 @ ^1.1.0
    sensirion/Sensirion I2C SEN66 @ ^1.3.1
    sensirion/Sensirion I2C SEN68 @ ^1.1.0
    sensirion/Sensirion I2C SCD4x @ ^1.1.0
    h2zero/NimBLE-Arduino @ ^1.4.1
    bodmer/TFT_eSPI @ ^2.5.43
