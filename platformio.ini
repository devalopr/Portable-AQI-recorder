[env:esp32-c3-super-mini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; USB CDC on boot for ESP32-C3 Super Mini so Serial works over USB
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; deep+ ensures transitive library dependencies are resolved properly
lib_ldf_mode = deep+

lib_deps =
    sensirion/Sensirion I2C SEN5X @ ^0.3.0
    sensirion/Sensirion Gadget BLE Arduino Lib @ ^1.2.0
    sensirion/Sensirion UPT Core @ ^0.3.0
    h2zero/NimBLE-Arduino @ ^1.4.1
    https://github.com/Nkawu/TFT_22_ILI9225.git
