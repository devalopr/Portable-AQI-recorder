[env:esp32-c3-super-mini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; USB CDC on boot for ESP32-C3 Super Mini so Serial works over USB
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=0
    -D TFT_INVERSION_OFF=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=-1
    -D TFT_MOSI=6
    -D TFT_SCLK=4
    -D TFT_CS=7
    -D TFT_DC=0
    -D TFT_RST=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_GFXFF=1
    -D SPI_FREQUENCY=40000000

; deep+ ensures transitive library dependencies are resolved properly
lib_ldf_mode = deep+

lib_deps =
    sensirion/Sensirion I2C SEN5X @ ^0.3.0
    h2zero/NimBLE-Arduino @ ^1.4.1
    bodmer/TFT_eSPI @ ^2.5.43
